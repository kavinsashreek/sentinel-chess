<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sentinel Chess</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div class="animated-bg">
        <div class="gradient-mesh"></div>
        <div class="chess-particle" style="left: 5%; animation-duration: 18s;">♘</div>
        <div class="chess-particle" style="left: 25%; animation-duration: 20s;">♜</div>
        <div class="chess-particle" style="left: 45%; animation-duration: 19s;">♚</div>
        <div class="chess-particle" style="left: 65%; animation-duration: 21s;">♖</div>
        <div class="chess-particle" style="left: 85%; animation-duration: 17s;">♗</div>
    </div>

    <nav class="top-nav">
        <div class="brand pulse-text">Sentinel Chess</div>
        <div class="nav-links">
            <button class="nav-btn active" data-target="homePage">Home</button>
            <button class="nav-btn" data-target="leaderboardPage">Rankings</button>
        </div>
    </nav>

    <div id="homePage" class="page-container active-page">
        <div class="glass-panel text-center hover-glow">
            <h1>Sentinel Portal</h1>
            <div class="profile-setup">
                <input type="text" id="nicknameInput" placeholder="Enter Nickname" maxlength="15">
                <div class="id-badge">ID: <span id="myPlayerId">Loading...</span></div>
            </div>
            <div class="menu-buttons" id="primaryMenu">
                <button id="btnSinglePlayer" class="action-btn primary cyber-glow">Play vs AI</button>
            </div>
            <div id="difficultySelector" class="hidden">
                <h3>Select AI Difficulty</h3>
                <div class="menu-buttons horizontal">
                    <button data-level="1" class="btn-diff action-btn secondary hover-lift">Beginner</button>
                    <button data-level="5" class="btn-diff action-btn primary cyber-glow">Grandmaster</button>
                </div>
            </div>
        </div>
    </div>

    <div id="leaderboardPage" class="page-container hidden">
        <div class="glass-panel hover-glow">
            <h2 class="text-center" style="color:#00c6ff;">Global Rankings</h2>
            <ul id="leaderboardList" class="data-list"></ul>
        </div>
    </div>

    <div id="gamePage" class="page-container hidden">
        <div class="game-header">
            <div id="opponentInfo" class="player-info">Opponent</div>
            <div class="controls-row">
                <button id="btnToggleView" class="action-btn small secondary">View (2D/3D)</button>
                <div id="status">White to Move</div>
            </div>
        </div>
        
        <div class="game-view-container">
            <div id="capturedTableLeft" class="captured-table hidden">
                <h4 class="text-center">Opponent Captured</h4>
                <div class="captured-grid" id="capturedMe"></div>
            </div>
            
            <div class="board-wrapper">
                <div id="chessboard" class="board"></div>
            </div>

            <div id="capturedTableRight" class="captured-table hidden">
                <h4 class="text-center">Your Captured</h4>
                <div class="captured-grid" id="capturedOpponent"></div>
            </div>
        </div>

        <div class="game-footer">
            <div id="myInfo" class="player-info"><span id="myDisplayName">You</span></div>
            <div class="game-controls">
                <button id="btnHint" class="action-btn small hover-lift">Hint (<span id="hintCount">2</span>)</button>
                <button id="btnResign" class="action-btn small danger hover-lift">Resign</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
